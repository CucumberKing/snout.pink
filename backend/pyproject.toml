[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.3.0",
    "fastapi>=0.115.12",
    "rich>=14.0.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.4.0",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "user-agents>=2.2.0",
    "uvicorn>=0.31.0",
    "clerk-backend-api>=3.2.1",
    "pyjwt[crypto]>=2.10.1",
    "pydantic[email]>=2.11.7",
    "beanie>=2.0.0",
    "motor>=3.7.1",
    "httpx[http2]>=0.27.0",
    "structlog>=25.5.0",
    "webauthn>=2.7.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.2",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "mongomock>=4.2.0",
    "mongomock-motor>=0.0.36",
    "python-dotenv>=1.1.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM"]
# E*: pycodestyle errors, 
# F: pyflakes, 
# I: import sort (isort)
# UP: pyupgrade (e.g., Optional[T] -> T|None)
# B: bugbear (good correctness checks)
# C4: comprehensions (e.g., list(range(10)) -> [i for i in range(10)])
# SIM: simplify (e.g., if x: -> if x)

exclude = ["*.ipynb"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.format]
exclude = ["*.ipynb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
